const melody = [];
        let currentTime = 0;
        const step = 0.22; // Speed/Tempo control (smaller = faster)

        // Helper function to build the sequence easily
        function addNote(note, durationMultiplier = 1, waitMultiplier = 1) {
            if (note) {
                melody.push({ 
                    time: currentTime, 
                    note: note, 
                    duration: step * durationMultiplier * 0.8 // Leave a tiny gap between notes
                });
            }
            currentTime += (step * waitMultiplier);
        }

        function addChord(notes, durationMultiplier = 1, waitMultiplier = 1) {
            notes.forEach(note => {
                melody.push({ time: currentTime, note: note, duration: step * durationMultiplier * 0.8 });
            });
            currentTime += (step * waitMultiplier);
        }

        // === COMPOSE LA CAMPANELLA (Intro & Main Theme) ===

        // Intro
        addNote("D#5"); addNote("D#6");
        addNote("D#5"); addNote("D#6");
        addNote("E5");  addNote("D#6");
        addNote("D#5"); addNote("D#6");
        addNote("C#5"); addNote("D#6");
        addNote("B4");  addNote("D#6");
        addNote("A#4"); addNote("D#6");
        addNote("G#4"); addNote("D#6");
        addNote("G4");  addNote("D#6");
        addNote("G#4"); addNote("A#4"); addNote("B4"); addNote("C#5"); 
        addNote("D#5", 2, 2);

        // Theme 1
        addNote("G#5"); addNote("D#6");
        addNote("G#5"); addNote("D#6");
        addNote("A5");  addNote("D#6");
        addNote("G#5"); addNote("D#6");
        addNote("F#5"); addNote("D#6");
        addNote("E5");  addNote("D#6");
        addNote("D#5"); addNote("D#6");
        addNote("C#5"); addNote("D#6");
        addNote("B4");  addNote("D#6");
        addNote("A#4"); addNote("D#6");
        addNote("G#4"); addNote("D#6");
        addNote("G4");  addNote("D#6");
        addNote("G#4"); addNote("A#4"); addNote("B4"); addNote("C#5"); 
        addNote("D#5", 2, 2);

        // Theme 2 (Higher variation)
        addNote("B5"); addNote("D#6");
        addNote("B5"); addNote("D#6");
        addNote("C#6"); addNote("D#6");
        addNote("B5"); addNote("D#6");
        addNote("A5"); addNote("D#6");
        addNote("G#5"); addNote("D#6");
        addNote("F#5"); addNote("D#6");
        addNote("E5"); addNote("D#6");
        addNote("D#5"); addNote("D#6");
        addNote("C#5"); addNote("D#6");
        addNote("B4"); addNote("D#6");
        addNote("A#4"); addNote("D#6");
        
        // Fast descending run (approximate)
        addChord(["G#4", "B4"]); addNote("G#5", 0.5, 0.5); addNote("F#5", 0.5, 0.5);
        addNote("E5", 0.5, 0.5); addNote("D#5", 0.5, 0.5);
        addNote("C#5", 0.5, 0.5); addNote("B4", 0.5, 0.5);
        addNote("A#4", 0.5, 0.5); addNote("G#4", 0.5, 0.5);
        addNote("G4", 0.5, 0.5); addNote("A#4", 0.5, 0.5);
        
        addNote("G#4", 2, 2);
        
        // Chords section
        addChord(["E4", "G#4", "C#5"]); addNote("D#6");
        addChord(["E4", "G#4", "C#5"]); addNote("D#6");
        addChord(["F#4", "A4", "D#5"]); addNote("D#6");
        addChord(["E4", "G#4", "C#5"]); addNote("D#6");
        addChord(["D#4", "F#4", "B4"]); addNote("D#6");
        addChord(["C#4", "E4", "A4"]); addNote("D#6");
        addChord(["B3", "D#4", "G#4"]); addNote("D#6");
        addChord(["A#3", "C#4", "F#4"]); addNote("D#6");

        addChord(["F#3", "A#3", "D#4"]); addNote("D#6");
