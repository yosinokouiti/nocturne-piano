const canvas=$('bg'),c=canvas.getContext('2d');let w,h,particles=[],ripples=[],stars=Array.from({length:90},()=>[Math.random(),Math.random(),Math.random()]);function resize(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio,2);canvas.width=w*d;canvas.height=h*d;c.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);resize();let palettes={gold:[42,24],moon:[205,235],galaxy:[270,195],rose:[335,22]};function theme(){return $('theme').value==='auto'?songs[idx].theme:$('theme').value}function burst(n){let m=midi(n),x=w*(.1+.8*(m-21)/87),y=h*.72;let hue=palettes[theme()][0];for(let i=0;i<9;i++)particles.push({x,y,vx:(Math.random()-.5)*3,vy:-1-Math.random()*5,life:1,hue:hue+Math.random()*40,size:1+Math.random()*3});ripples.push({x,y,r:2,life:1,hue});if(particles.length>500)particles.splice(0,particles.length-500)}
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function scenery(mode,ms){
 const t=reduced?0:ms*.00015;
 c.save();
 // Broad luminous clouds behind the translucent panels.
 for(let i=0;i<4;i++){
 let x=w*(.15+i*.25+Math.sin(t+i)*.07),y=h*(.15+i*.13);
 let haze=c.createRadialGradient(x,y,0,x,y,Math.max(w,h)*.55);
 let hue=palettes[mode][i%2];haze.addColorStop(0,`hsla(${hue},75%,65%,.11)`);haze.addColorStop(1,'transparent');
 c.fillStyle=haze;c.fillRect(0,0,w,h);
 }
 if(mode==='moon'){
  // Moonlit lake, distant mountain silhouettes and reflected light.
  let horizon=h*.66;c.fillStyle='#060c20aa';c.beginPath();c.moveTo(0,horizon);
  for(let x=0;x<=w;x+=20)c.lineTo(x,horizon-25-35*Math.sin(x/w*9)-15*Math.sin(x/w*23));
  c.lineTo(w,h);c.lineTo(0,h);c.fill();
  c.fillStyle='#07132688';c.fillRect(0,horizon,w,h-horizon);
  for(let i=0;i<50;i++){let y=horizon+(h-horizon)*i/50,spread=15+i*2.6;
   c.strokeStyle=`rgba(186,211,255,${.25*(1-i/60)})`;c.lineWidth=1;
   let offset=Math.sin(t*8+i*1.9)*spread*.35;
   c.beginPath();c.moveTo(w*.79-spread+offset,y);c.lineTo(w*.79+spread+offset,y);c.stroke();
  }
 }else if(mode==='galaxy'){
  c.save();c.translate(w*.65,h*.31);c.rotate(-.45);
  for(let i=0;i<6;i++){let neb=c.createRadialGradient((i-3)*w*.10,0,0,(i-3)*w*.10,0,w*.30);
   neb.addColorStop(0,`hsla(${235+i*15},80%,65%,.12)`);neb.addColorStop(1,'transparent');c.fillStyle=neb;c.fillRect(-w,-h,w*2,h*2);}
  c.restore();
  for(let i=0;i<70;i++){let x=((i*.618)%1)*w,y=((i*.381)%1)*h; c.fillStyle='#e8e2ff88';c.fillRect(x,y,1,1);}
 }else if(mode==='gold'){
  c.globalCompositeOperation='screen';
  for(let i=0;i<7;i++){let x=w*(i/6+.06*Math.sin(t+i)),beam=c.createLinearGradient(x,0,x+w*.14,h);

  for(let i=0;i<28;i++){let x=((i*.618+Math.sin(t+i)*.02)%1)*w,y=((i*.37-t*.1)%1+1)%1*h;

 }else if(mode==='rose'){
  for(let i=0;i<32;i++){let x=((i*.618+Math.sin(t*2+i)*.06)%1+1)%1*w,y=((i*.317+t*.12)%1)*h;
   c.save();c.translate(x,y);c.rotate(i+t*2);c.fillStyle=`rgba(255,${145+i%50},190,${.18+i%4*.07})`;
   c.beginPath();c.ellipse(0,0,3+i%4,7+i%6,0,0,Math.PI*2);c.fill();c.restore();}
 }

}

function frame(ms){let now=ctx?.currentTime||0;visual=visual.filter(a=>{if(a.t>now)return true;mark(a.n,a.on);if(a.on)burst(a.n);return false});if(playing)update();let mode=theme(),[a,b]=palettes[mode],g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,`hsl(${b},45%,8%)`);g.addColorStop(1,`hsl(${a},45%,17%)`);c.fillStyle=g;c.fillRect(0,0,w,h);let glow=c.createRadialGradient(w*.74,h*.23,0,w*.74,h*.23,w*.65);glow.addColorStop(0,`hsla(${a},80%,55%,.19)`);glow.addColorStop(1,'transparent');c.fillStyle=glow;c.fillRect(0,0,w,h);scenery(mode,ms);for(let [x,y,z] of stars){c.fillStyle=`hsla(${a+30},80%,85%,${.15+.3*(.5+.5*Math.sin(ms*.001+z*30))})`;c.beginPath();c.arc(x*w,y*h,.6+z*1.2,0,7);c.fill()}if(mode==='moon'){c.fillStyle='#e9edfa';c.shadowColor='#aabfff';c.shadowBlur=40;c.beginPath();c.arc(w*.79,h*.20,Math.min(w,h)*.07,0,7);c.fill();c.shadowBlur=0}for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.015;p.life-=.012;c.fillStyle=`hsla(${p.hue},90%,75%,${Math.max(0,p.life)})`;c.beginPath();c.arc(p.x,p.y,p.size,0,7);c.fill()}particles=particles.filter(p=>p.life>0);for(let r of ripples){r.r+=2.6;r.life-=.014;c.strokeStyle=`hsla(${r.hue},85%,75%,${Math.max(0,r.life)*.5})`;c.beginPath();c.ellipse(r.x,r.y,r.r,r.r*.35,0,0,7);c.stroke()}ripples=ripples.filter(r=>r.life>0);requestAnimationFrame(frame)}select(0);$('status').textContent="準備完了 — 再生で録音グランドピアノを読み込みます（v1.2）";requestAnimationFrame(frame);
